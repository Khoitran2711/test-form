
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Góp ý & Phản ánh - BVĐK Ninh Thuận</title>
  
  <!-- Thư viện CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
    .loading-screen { 
      position: fixed; inset: 0; background: #ffffff; 
      display: flex; flex-direction: column; align-items: center; justify-content: center; 
      z-index: 9999; transition: opacity 0.5s ease-out; 
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #2563eb;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .fade-in { animation: fadeIn 0.6s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Tùy chỉnh thanh cuộn */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>

  <!-- Import Map chuẩn hóa (Fix lỗi treo) -->
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.7.0"
  }
}
</script>
  
  <!-- Babel Standalone để dịch code React/TS ngay trong trình duyệt -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <!-- Màn hình chờ -->
  <div class="loading-screen" id="initial-loader">
    <div class="spinner"></div>
    <p class="mt-4 text-blue-900 font-bold text-xs uppercase tracking-[0.2em] animate-pulse">Hệ thống đang khởi động...</p>
  </div>

  <!-- Toàn bộ Logic Ứng dụng -->
  <script type="text/babel" data-presets="react,typescript" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import ReactDOM from 'react-dom/client';
    import { GoogleGenAI } from "@google/genai";

    // --- CẤU HÌNH ---
    const HOSPITAL = {
      name: "Bệnh viện Đa khoa Tỉnh Ninh Thuận",
      address: "Số 20 Nguyễn Văn Cừ, Phường Văn Hải, TP. Phan Rang - Tháp Chàm",
      hotline: "0259.3822.660",
      email: "bvdk@ninhthuan.gov.vn"
    };

    const DEPARTMENTS = [
      "Khoa Cấp cứu", "Khoa Khám bệnh", "Khoa Nội tổng hợp", "Khoa Ngoại", 
      "Khoa Sản", "Khoa Nhi", "Khoa Mắt", "Khoa Tai Mũi Họng", "Khoa Răng Hàm Mặt"
    ];

    // --- ỨNG DỤNG CHÍNH ---
    const App = () => {
      const [activeTab, setActiveTab] = useState('home'); // home, form, history, chat
      const [history, setHistory] = useState([]);
      const [isModalOpen, setIsModalOpen] = useState(false);

      useEffect(() => {
        // Tắt loader sau khi nạp xong
        const loader = document.getElementById('initial-loader');
        if (loader) {
          setTimeout(() => {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
          }, 1000);
        }
        
        // Lấy lịch sử từ LocalStorage
        const saved = localStorage.getItem('bvnt_feedback');
        if (saved) setHistory(JSON.parse(saved));
      }, []);

      const saveFeedback = (data) => {
        const newList = [data, ...history];
        setHistory(newList);
        localStorage.setItem('bvnt_feedback', JSON.stringify(newList));
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Navigation Bar */}
          <nav className="bg-white border-b sticky top-0 z-50 px-4 h-16 flex items-center shadow-sm">
            <div className="container mx-auto flex justify-between items-center">
              <div className="flex items-center space-x-2 cursor-pointer" onClick={() => setActiveTab('home')}>
                <div className="bg-blue-600 p-1.5 rounded-lg text-white">
                  <i className="fas fa-hospital-symbol text-lg"></i>
                </div>
                <h1 className="font-black text-blue-900 uppercase text-sm tracking-tighter leading-none hidden sm:block">
                  {HOSPITAL.name}
                </h1>
              </div>
              <div className="flex space-x-1">
                <button onClick={() => setActiveTab('home')} className={`px-4 py-2 rounded-full text-xs font-bold uppercase tracking-widest transition-all ${activeTab === 'home' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-100'}`}>Trang chủ</button>
                <button onClick={() => setActiveTab('history')} className={`px-4 py-2 rounded-full text-xs font-bold uppercase tracking-widest transition-all ${activeTab === 'history' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-100'}`}>Tra cứu</button>
              </div>
            </div>
          </nav>

          <main className="flex-grow container mx-auto px-4 py-8 max-w-4xl fade-in">
            {activeTab === 'home' && (
              <div className="space-y-12 py-10">
                <div className="text-center space-y-4">
                  <h2 className="text-4xl md:text-5xl font-black text-slate-800 tracking-tight leading-tight">CHÚNG TÔI LUÔN LẮNG NGHE Ý KIẾN CỦA BẠN</h2>
                  <p className="text-slate-500 max-w-2xl mx-auto italic">Mọi phản ánh là cơ sở để bệnh viện cải thiện chất lượng phục vụ tốt hơn mỗi ngày.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  <div className="bg-white p-8 rounded-[2rem] shadow-xl border hover:-translate-y-2 transition-all cursor-pointer group" onClick={() => setActiveTab('form')}>
                    <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                      <i className="fas fa-edit text-2xl"></i>
                    </div>
                    <h3 className="text-xl font-black mb-2">Gửi phản ánh mới</h3>
                    <p className="text-slate-400 text-sm mb-6">Gửi góp ý về thái độ phục vụ, thủ tục hoặc cơ sở vật chất của bệnh viện.</p>
                    <button className="w-full py-4 bg-blue-600 text-white rounded-xl font-bold uppercase text-xs tracking-widest shadow-lg shadow-blue-100">Bắt đầu ngay</button>
                  </div>

                  <div className="bg-white p-8 rounded-[2rem] shadow-xl border hover:-translate-y-2 transition-all cursor-pointer group" onClick={() => setActiveTab('history')}>
                    <div className="w-16 h-16 bg-green-50 text-green-600 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-green-600 group-hover:text-white transition-colors">
                      <i className="fas fa-search text-2xl"></i>
                    </div>
                    <h3 className="text-xl font-black mb-2">Xem kết quả xử lý</h3>
                    <p className="text-slate-400 text-sm mb-6">Kiểm tra xem ý kiến của bạn đã được Ban Giám đốc tiếp nhận và phản hồi chưa.</p>
                    <button className="w-full py-4 bg-slate-800 text-white rounded-xl font-bold uppercase text-xs tracking-widest shadow-lg shadow-slate-100">Tra cứu kết quả</button>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'form' && <FeedbackForm onCancel={() => setActiveTab('home')} onSave={saveFeedback} />}
            
            {activeTab === 'history' && <HistoryView history={history} />}
          </main>

          <footer className="bg-white border-t py-8 mt-10">
            <div className="container mx-auto px-4 text-center space-y-4">
              <p className="font-black text-xs uppercase tracking-[0.2em] text-blue-900">{HOSPITAL.name}</p>
              <div className="flex flex-col md:flex-row justify-center items-center space-y-2 md:space-y-0 md:space-x-8 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                <span><i className="fas fa-map-marker-alt mr-2"></i>{HOSPITAL.address}</span>
                <span><i className="fas fa-phone-alt mr-2"></i>Hotline: {HOSPITAL.hotline}</span>
              </div>
            </div>
          </footer>

          <ChatAssistant />
        </div>
      );
    };

    // --- COMPONENT FORM ---
    const FeedbackForm = ({ onCancel, onSave }) => {
      const [form, setForm] = useState({ name: '', phone: '', dept: '', content: '' });
      const [isSent, setIsSent] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        const data = {
          ...form,
          id: Math.random().toString(36).substr(2, 6).toUpperCase(),
          date: new Date().toLocaleString('vi-VN'),
          status: 'Đang xử lý'
        };
        onSave(data);
        setIsSent(true);
      };

      if (isSent) {
        return (
          <div className="bg-white p-12 rounded-[3rem] shadow-2xl text-center space-y-6 fade-in border-4 border-green-50">
            <div className="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-4xl">
              <i className="fas fa-check-circle animate-bounce"></i>
            </div>
            <h2 className="text-3xl font-black text-slate-800 uppercase">Gửi thành công!</h2>
            <p className="text-slate-500 font-medium italic">Cảm ơn bạn. Ý kiến đã được ghi nhận vào hệ thống xử lý khẩn cấp.</p>
            <button onClick={onCancel} className="bg-slate-900 text-white px-8 py-3 rounded-xl font-bold uppercase text-xs tracking-widest">Quay lại trang chủ</button>
          </div>
        );
      }

      return (
        <div className="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-2xl border fade-in">
          <h2 className="text-2xl font-black text-blue-900 uppercase mb-8 border-l-4 border-blue-600 pl-4">Phiếu Phản Ánh Trực Tuyến</h2>
          <form onSubmit={handleSubmit} className="space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div className="space-y-2">
                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Họ và tên</label>
                <input required className="w-full px-5 py-4 bg-slate-50 border-2 border-transparent focus:border-blue-500 rounded-2xl outline-none transition-all font-medium" placeholder="Nguyễn Văn A" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
              </div>
              <div className="space-y-2">
                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Số điện thoại</label>
                <input required type="tel" className="w-full px-5 py-4 bg-slate-50 border-2 border-transparent focus:border-blue-500 rounded-2xl outline-none transition-all font-medium" placeholder="0912..." value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} />
              </div>
            </div>
            <div className="space-y-2">
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Khoa/Phòng phản ánh</label>
              <select required className="w-full px-5 py-4 bg-slate-50 border-2 border-transparent focus:border-blue-500 rounded-2xl outline-none transition-all font-medium appearance-none" value={form.dept} onChange={e => setForm({...form, dept: e.target.value})}>
                <option value="">-- Chọn Khoa/Phòng --</option>
                {DEPARTMENTS.map(d => <option key={d} value={d}>{d}</option>)}
              </select>
            </div>
            <div className="space-y-2">
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Nội dung chi tiết</label>
              <textarea required rows="5" className="w-full px-5 py-4 bg-slate-50 border-2 border-transparent focus:border-blue-500 rounded-2xl outline-none transition-all font-medium resize-none" placeholder="Mô tả sự việc một cách cụ thể nhất có thể..." value={form.content} onChange={e => setForm({...form, content: e.target.value})}></textarea>
            </div>
            <div className="flex flex-col sm:flex-row gap-4 pt-4">
              <button type="submit" className="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black uppercase text-sm tracking-widest shadow-xl shadow-blue-100 hover:scale-[1.02] active:scale-95 transition-all">Gửi phản ánh ngay</button>
              <button type="button" onClick={onCancel} className="px-10 bg-slate-100 text-slate-500 py-4 rounded-2xl font-bold uppercase text-xs">Hủy</button>
            </div>
          </form>
        </div>
      );
    };

    // --- COMPONENT LỊCH SỬ ---
    const HistoryView = ({ history }) => {
      if (history.length === 0) {
        return (
          <div className="text-center py-20 bg-white rounded-[3rem] border border-dashed border-slate-300">
            <i className="fas fa-inbox text-slate-200 text-6xl mb-4"></i>
            <p className="text-slate-400 font-bold uppercase tracking-widest text-sm">Chưa có phản ánh nào được ghi nhận</p>
          </div>
        );
      }
      return (
        <div className="space-y-6 fade-in">
          <h2 className="text-2xl font-black text-slate-800 uppercase tracking-tight">Lịch sử gửi phản ánh</h2>
          {history.map(item => (
            <div key={item.id} className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 hover:shadow-md transition-all">
              <div className="flex justify-between items-start mb-4">
                <div>
                  <span className="text-[10px] font-black text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full uppercase tracking-widest mr-2">Mã: #{item.id}</span>
                  <span className="text-[10px] font-bold text-slate-300 uppercase">{item.date}</span>
                </div>
                <span className="text-[10px] font-black px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full uppercase">{item.status}</span>
              </div>
              <p className="text-slate-900 font-bold text-sm mb-2">{item.dept}</p>
              <div className="bg-slate-50 p-4 rounded-xl italic text-slate-500 text-sm border-l-4 border-slate-200">
                "{item.content}"
              </div>
            </div>
          ))}
        </div>
      );
    };

    // --- TRỢ LÝ ẢO Gemini AI ---
    const ChatAssistant = () => {
      const [isOpen, setIsOpen] = useState(false);
      const [messages, setMessages] = useState([{ role: 'ai', text: 'Xin chào! Tôi là trợ lý ảo của BV Ninh Thuận. Bạn cần tôi hỗ trợ gì về quy trình góp ý không?' }]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const scrollRef = useRef();

      useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
      }, [messages]);

      const handleSend = async () => {
        if (!input.trim() || loading) return;
        const userText = input;
        setInput('');
        setMessages(prev => [...prev, { role: 'user', text: userText }]);
        setLoading(true);

        try {
          const ai = new GoogleGenAI({ apiKey: window.process?.env?.API_KEY || '' });
          const response = await ai.models.generateContent({
            model: 'gemini-2.5-flash-lite-latest',
            contents: userText,
            config: {
              systemInstruction: `Bạn là trợ lý ảo tại BV Ninh Thuận. Hãy hỗ trợ bệnh nhân gửi phản ánh lịch sự, chuyên nghiệp. Hotline: 0259.3822.660.`
            }
          });
          setMessages(prev => [...prev, { role: 'ai', text: response.text }]);
        } catch {
          setMessages(prev => [...prev, { role: 'ai', text: 'Tôi đang bận một chút, hãy thử lại sau nhé!' }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed bottom-6 right-6 z-[60]">
          {isOpen ? (
            <div className="bg-white w-80 md:w-96 h-[500px] rounded-[2rem] shadow-2xl border border-slate-100 flex flex-col overflow-hidden animate-in slide-in-from-bottom-5">
              <div className="bg-blue-600 p-5 text-white flex justify-between items-center">
                <div className="flex items-center space-x-3">
                  <div className="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center">
                    <i className="fas fa-robot"></i>
                  </div>
                  <span className="font-bold text-sm">Trợ lý ảo BV Ninh Thuận</span>
                </div>
                <button onClick={() => setIsOpen(false)}><i className="fas fa-times"></i></button>
              </div>
              <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
                {messages.map((m, i) => (
                  <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[85%] p-3 rounded-2xl text-xs font-medium ${m.role === 'user' ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white text-slate-800 shadow-sm rounded-bl-none'}`}>
                      {m.text}
                    </div>
                  </div>
                ))}
                {loading && <div className="animate-pulse text-[10px] text-slate-400 font-bold uppercase">Đang suy nghĩ...</div>}
              </div>
              <div className="p-4 bg-white border-t">
                <div className="flex bg-slate-100 rounded-xl px-4 py-2">
                  <input className="bg-transparent flex-1 outline-none text-xs font-medium" placeholder="Hỏi tôi về thủ tục góp ý..." value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSend()} />
                  <button onClick={handleSend} className="text-blue-600 ml-2"><i className="fas fa-paper-plane"></i></button>
                </div>
              </div>
            </div>
          ) : (
            <button onClick={() => setIsOpen(true)} className="bg-blue-600 w-14 h-14 rounded-full shadow-2xl text-white flex items-center justify-center hover:scale-110 active:scale-95 transition-all">
              <i className="fas fa-comment-dots text-xl"></i>
            </button>
          )}
        </div>
      );
    };

    // Khởi tạo React
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
