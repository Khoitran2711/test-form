
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống Phản ánh - BVĐK Ninh Thuận</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .loading-screen { 
      position: fixed; inset: 0; background: #ffffff; 
      display: flex; flex-direction: column; align-items: center; justify-content: center; 
      z-index: 9999; transition: opacity 0.5s ease-out; 
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #2563eb;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .fade-in { animation: fadeIn 0.5s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.7.0"
  }
}
</script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <div class="loading-screen" id="initial-loader">
    <div class="spinner"></div>
    <p class="mt-4 text-blue-900 font-bold text-xs uppercase tracking-widest animate-pulse">Khởi tạo hệ thống Ninh Thuận...</p>
  </div>

  <script type="text/babel" data-presets="react,typescript" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import ReactDOM from 'react-dom/client';
    import { GoogleGenAI } from "@google/genai";

    const HOSPITAL = {
      name: "Bệnh viện Đa khoa Tỉnh Ninh Thuận",
      address: "Số 20 Nguyễn Văn Cừ, Văn Hải, TP. Phan Rang - Tháp Chàm",
      hotline: "0259.3822.660"
    };

    const DEPARTMENTS = ["Khoa Cấp cứu", "Khoa Khám bệnh", "Khoa Nội", "Khoa Ngoại", "Khoa Sản", "Khoa Nhi", "Khoa Mắt", "Khoa Răng Hàm Mặt"];

    const App = () => {
      const [view, setView] = useState('patient'); // patient, admin_login, admin_dashboard
      const [activeTab, setActiveTab] = useState('home'); // home, form, history
      const [feedbacks, setFeedbacks] = useState([]);
      const [isLoggedIn, setIsLoggedIn] = useState(false);

      useEffect(() => {
        const loader = document.getElementById('initial-loader');
        if (loader) setTimeout(() => { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 500); }, 800);
        
        const saved = localStorage.getItem('bvnt_feedbacks');
        if (saved) setFeedbacks(JSON.parse(saved));

        const auth = sessionStorage.getItem('admin_auth');
        if (auth === 'true') { setIsLoggedIn(true); }
      }, []);

      const updateFeedbacks = (newList) => {
        setFeedbacks(newList);
        localStorage.setItem('bvnt_feedbacks', JSON.stringify(newList));
      };

      const handleLogout = () => {
        sessionStorage.removeItem('admin_auth');
        setIsLoggedIn(false);
        setView('patient');
      };

      // Giao diện Bệnh nhân
      if (view === 'patient') {
        return (
          <div className="min-h-screen flex flex-col fade-in">
            <nav className="bg-white border-b h-16 flex items-center px-4 sticky top-0 z-40 shadow-sm">
              <div className="container mx-auto flex justify-between items-center">
                <div className="flex items-center space-x-2 cursor-pointer" onClick={() => setActiveTab('home')}>
                  <div className="bg-blue-600 p-1.5 rounded-lg text-white"><i className="fas fa-hospital"></i></div>
                  <span className="font-black text-blue-900 uppercase text-xs tracking-tighter">{HOSPITAL.name}</span>
                </div>
                <div className="flex space-x-2">
                  <button onClick={() => setActiveTab('home')} className={`px-4 py-1.5 rounded-full text-[10px] font-bold uppercase transition-all ${activeTab === 'home' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-100'}`}>Trang chủ</button>
                  <button onClick={() => setActiveTab('history')} className={`px-4 py-1.5 rounded-full text-[10px] font-bold uppercase transition-all ${activeTab === 'history' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-100'}`}>Tra cứu</button>
                </div>
              </div>
            </nav>

            <main className="flex-grow container mx-auto px-4 py-10 max-w-4xl">
              {activeTab === 'home' && (
                <div className="text-center space-y-12">
                  <div className="space-y-4 pt-10">
                    <h2 className="text-4xl font-black text-slate-800 tracking-tight leading-tight">CHÚNG TÔI LUÔN LẮNG NGHE</h2>
                    <p className="text-slate-500 italic max-w-lg mx-auto">Sự hài lòng của quý bệnh nhân là mục tiêu hàng đầu của chúng tôi.</p>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-8 text-left">
                    <div className="bg-white p-8 rounded-[2.5rem] shadow-xl border border-white hover:-translate-y-2 transition-all group cursor-pointer" onClick={() => setActiveTab('form')}>
                      <div className="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-blue-600 group-hover:text-white transition-colors"><i className="fas fa-edit text-xl"></i></div>
                      <h3 className="text-xl font-black text-slate-800">Gửi phản ánh mới</h3>
                      <p className="text-slate-400 text-sm mt-2 mb-6">Góp ý về thái độ, thủ tục hoặc hạ tầng bệnh viện.</p>
                      <button className="w-full py-3.5 bg-blue-600 text-white rounded-xl font-bold uppercase text-[10px] tracking-[0.2em]">Bắt đầu</button>
                    </div>
                    <div className="bg-white p-8 rounded-[2.5rem] shadow-xl border border-white hover:-translate-y-2 transition-all group cursor-pointer" onClick={() => setActiveTab('history')}>
                      <div className="w-14 h-14 bg-green-50 text-green-600 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-green-600 group-hover:text-white transition-colors"><i className="fas fa-search text-xl"></i></div>
                      <h3 className="text-xl font-black text-slate-800">Tra cứu phản hồi</h3>
                      <p className="text-slate-400 text-sm mt-2 mb-6">Xem kết quả trả lời từ Ban Giám đốc bệnh viện.</p>
                      <button className="w-full py-3.5 bg-slate-800 text-white rounded-xl font-bold uppercase text-[10px] tracking-[0.2em]">Kiểm tra ngay</button>
                    </div>
                  </div>
                </div>
              )}
              {activeTab === 'form' && <FeedbackForm onCancel={() => setActiveTab('home')} onSubmit={(d) => updateFeedbacks([d, ...feedbacks])} />}
              {activeTab === 'history' && <HistoryView feedbacks={feedbacks} />}
            </main>

            <footer className="bg-white border-t py-10">
              <div className="container mx-auto px-4 text-center space-y-6">
                <p className="text-[10px] font-black text-slate-300 uppercase tracking-widest">{HOSPITAL.name}</p>
                <button onClick={() => setView(isLoggedIn ? 'admin_dashboard' : 'admin_login')} className="text-[9px] font-bold text-slate-300 hover:text-blue-500 uppercase tracking-[0.3em] transition-colors">Khu vực Quản trị viên</button>
              </div>
            </footer>
            <ChatAssistant />
          </div>
        );
      }

      // Giao diện Đăng nhập Admin
      if (view === 'admin_login') {
        return <AdminLogin onCancel={() => setView('patient')} onSuccess={() => { setIsLoggedIn(true); setView('admin_dashboard'); }} />;
      }

      // Giao diện Dashboard Admin
      if (view === 'admin_dashboard') {
        return <AdminDashboard feedbacks={feedbacks} onLogout={handleLogout} onUpdate={updateFeedbacks} onBack={() => setView('patient')} />;
      }
    };

    // --- CÁC COMPONENT CON ---

    const FeedbackForm = ({ onCancel, onSubmit }) => {
      const [form, setForm] = useState({ name: '', phone: '', dept: '', content: '' });
      const [sent, setSent] = useState(false);
      if (sent) return (
        <div className="bg-white p-12 rounded-[3rem] shadow-2xl text-center space-y-4 fade-in">
          <i className="fas fa-check-circle text-6xl text-green-500"></i>
          <h2 className="text-2xl font-black uppercase text-slate-800 tracking-tight">Gửi thành công!</h2>
          <p className="text-slate-400 text-sm italic">Cảm ơn bạn, chúng tôi sẽ sớm phản hồi.</p>
          <button onClick={onCancel} className="mt-6 bg-slate-900 text-white px-8 py-3 rounded-xl font-bold text-xs uppercase tracking-widest">Về trang chủ</button>
        </div>
      );
      return (
        <div className="bg-white p-8 md:p-12 rounded-[3rem] shadow-2xl border fade-in">
          <h3 className="text-2xl font-black text-blue-900 uppercase mb-8 flex items-center"><i className="fas fa-pen-nib mr-3 text-blue-400"></i>Phiếu Phản Ánh</h3>
          <form onSubmit={(e) => { e.preventDefault(); onSubmit({...form, id: Math.random().toString(36).substr(2,6).toUpperCase(), date: new Date().toLocaleString('vi-VN'), status: 'Chờ xử lý'}); setSent(true); }} className="space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <input required placeholder="Họ và tên" className="w-full px-6 py-4 bg-slate-50 border-transparent focus:border-blue-500 border-2 rounded-2xl outline-none font-medium" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
              <input required placeholder="Số điện thoại" className="w-full px-6 py-4 bg-slate-50 border-transparent focus:border-blue-500 border-2 rounded-2xl outline-none font-medium" value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} />
            </div>
            <select required className="w-full px-6 py-4 bg-slate-50 border-transparent focus:border-blue-500 border-2 rounded-2xl outline-none font-medium appearance-none" value={form.dept} onChange={e => setForm({...form, dept: e.target.value})}>
              <option value="">Chọn Khoa/Phòng phản ánh</option>
              {DEPARTMENTS.map(d => <option key={d} value={d}>{d}</option>)}
            </select>
            <textarea required rows="5" placeholder="Nội dung chi tiết..." className="w-full px-6 py-4 bg-slate-50 border-transparent focus:border-blue-500 border-2 rounded-2xl outline-none font-medium resize-none" value={form.content} onChange={e => setForm({...form, content: e.target.value})}></textarea>
            <div className="flex space-x-4">
              <button type="submit" className="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest shadow-xl shadow-blue-100 transition-all hover:scale-[1.02]">Gửi ngay</button>
              <button type="button" onClick={onCancel} className="px-8 bg-slate-100 text-slate-400 py-4 rounded-2xl font-bold uppercase text-xs">Hủy</button>
            </div>
          </form>
        </div>
      );
    };

    const HistoryView = ({ feedbacks }) => (
      <div className="space-y-6 fade-in">
        <h3 className="text-xl font-black text-slate-800 uppercase tracking-tight mb-6 border-l-4 border-blue-600 pl-4">Lịch sử góp ý</h3>
        {feedbacks.length === 0 ? <p className="text-center py-20 text-slate-300 font-bold uppercase text-xs tracking-widest border border-dashed rounded-[2rem]">Chưa có dữ liệu phản ánh</p> : 
          feedbacks.map(f => (
            <div key={f.id} className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 transition-all hover:shadow-md">
              <div className="flex justify-between items-center mb-4">
                <span className="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded-full">MÃ: #{f.id}</span>
                <span className={`text-[9px] font-black px-3 py-1 rounded-full uppercase ${f.status === 'Đã phản hồi' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>{f.status}</span>
              </div>
              <p className="text-xs font-bold text-slate-400 mb-1 uppercase">{f.dept}</p>
              <p className="text-sm font-medium text-slate-800 leading-relaxed italic border-l-4 border-slate-100 pl-3">"{f.content}"</p>
              {f.reply && (
                <div className="mt-4 bg-blue-900 p-5 rounded-2xl text-white animate-in zoom-in-95">
                  <p className="text-[10px] font-black uppercase mb-2 opacity-50 tracking-widest">Phản hồi từ Bệnh viện:</p>
                  <p className="text-sm font-medium leading-relaxed">{f.reply}</p>
                </div>
              )}
            </div>
          ))
        }
      </div>
    );

    const AdminLogin = ({ onCancel, onSuccess }) => {
      const [u, setU] = useState(''); const [p, setP] = useState(''); const [err, setErr] = useState('');
      const handleLogin = (e) => {
        e.preventDefault();
        if (u === 'admin' && p === '123456') { sessionStorage.setItem('admin_auth', 'true'); onSuccess(); }
        else setErr('Tài khoản hoặc mật khẩu không đúng');
      };
      return (
        <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4 fade-in">
          <div className="bg-white w-full max-w-sm p-10 rounded-[2.5rem] shadow-2xl space-y-8">
            <div className="text-center space-y-2">
              <div className="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-xl shadow-blue-500/20"><i className="fas fa-user-shield"></i></div>
              <h2 className="text-xl font-black uppercase text-slate-800 tracking-tight">Cán bộ Đăng nhập</h2>
              <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Hệ thống Quản trị Nội bộ</p>
            </div>
            <form onSubmit={handleLogin} className="space-y-4">
              <input placeholder="Tên đăng nhập" className="w-full px-6 py-4 bg-slate-50 border-2 border-transparent focus:border-blue-500 rounded-xl outline-none text-sm font-medium" value={u} onChange={e => setU(e.target.value)} />
              <input type="password" placeholder="Mật khẩu" className="w-full px-6 py-4 bg-slate-50 border-2 border-transparent focus:border-blue-500 rounded-xl outline-none text-sm font-medium" value={p} onChange={e => setP(e.target.value)} />
              {err && <p className="text-red-500 text-[10px] font-bold uppercase text-center">{err}</p>}
              <button type="submit" className="w-full py-4 bg-blue-600 text-white rounded-xl font-black uppercase text-xs tracking-widest shadow-xl shadow-blue-500/10">Vào hệ thống</button>
              <button type="button" onClick={onCancel} className="w-full py-4 bg-slate-100 text-slate-400 rounded-xl font-bold uppercase text-xs">Quay lại</button>
            </form>
          </div>
        </div>
      );
    };

    const AdminDashboard = ({ feedbacks, onLogout, onUpdate, onBack }) => {
      const [replyId, setReplyId] = useState(null);
      const [replyText, setReplyText] = useState('');

      const handleReplySubmit = (id) => {
        const newList = feedbacks.map(f => f.id === id ? { ...f, status: 'Đã phản hồi', reply: replyText } : f);
        onUpdate(newList); setReplyId(null); setReplyText('');
      };

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col fade-in">
          <nav className="bg-slate-900 text-white h-16 flex items-center px-4 sticky top-0 z-40">
            <div className="container mx-auto flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <div className="bg-blue-600 p-1.5 rounded-lg"><i className="fas fa-lock text-xs"></i></div>
                <span className="font-black uppercase text-xs tracking-widest">Dashboard Quản trị</span>
              </div>
              <div className="flex space-x-4">
                <button onClick={onBack} className="text-[10px] font-bold uppercase text-slate-400 hover:text-white transition-colors">Xem web</button>
                <button onClick={onLogout} className="bg-red-600/20 text-red-500 px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase border border-red-500/20">Thoát</button>
              </div>
            </div>
          </nav>
          <main className="flex-grow container mx-auto px-4 py-8 max-w-5xl">
            <div className="flex justify-between items-center mb-8">
              <h2 className="text-2xl font-black text-slate-800 uppercase tracking-tight">Danh sách phản ánh <span className="text-blue-600">({feedbacks.length})</span></h2>
            </div>
            <div className="grid grid-cols-1 gap-4">
              {feedbacks.map(f => (
                <div key={f.id} className="bg-white p-6 md:p-8 rounded-[2rem] shadow-sm border border-slate-200 transition-all hover:border-blue-300">
                  <div className="flex justify-between items-start mb-6">
                    <div>
                      <span className="text-[10px] font-black bg-blue-50 text-blue-600 px-3 py-1 rounded-full uppercase tracking-widest mr-2">MÃ #{f.id}</span>
                      <span className="text-[10px] font-bold text-slate-300 uppercase">{f.date}</span>
                    </div>
                    <span className={`text-[10px] font-black px-4 py-1.5 rounded-full uppercase ${f.status === 'Đã phản hồi' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>{f.status}</span>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div className="space-y-3">
                      <p className="text-sm font-black text-slate-800 flex items-center"><i className="fas fa-user-circle mr-2 text-blue-500"></i> {f.name} - {f.phone}</p>
                      <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest"><i className="fas fa-map-pin mr-2 text-red-400"></i> {f.dept}</p>
                      <div className="bg-slate-50 p-4 rounded-xl border-l-4 border-slate-200 text-sm font-medium text-slate-600 italic">"{f.content}"</div>
                    </div>
                    <div className="flex flex-col justify-center border-t md:border-t-0 md:border-l border-slate-100 pt-6 md:pt-0 md:pl-8">
                      {f.status === 'Đã phản hồi' ? (
                        <div className="bg-green-50 p-4 rounded-2xl border border-green-100">
                          <p className="text-[10px] font-black text-green-700 uppercase mb-2 tracking-widest">Nội dung phản hồi:</p>
                          <p className="text-sm font-medium text-green-800 leading-relaxed italic">"{f.reply}"</p>
                        </div>
                      ) : (
                        replyId === f.id ? (
                          <div className="space-y-3 animate-in fade-in zoom-in-95">
                            <textarea placeholder="Nhập câu trả lời chính thức..." className="w-full px-5 py-3 bg-slate-50 border-2 border-blue-200 rounded-xl outline-none text-sm font-medium" rows="4" value={replyText} onChange={e => setReplyText(e.target.value)}></textarea>
                            <div className="flex space-x-2">
                              <button onClick={() => handleReplySubmit(f.id)} className="flex-1 bg-green-600 text-white py-2 rounded-lg font-black text-[10px] uppercase shadow-lg shadow-green-200">Xác nhận phản hồi</button>
                              <button onClick={() => setReplyId(null)} className="px-4 bg-slate-100 text-slate-400 rounded-lg font-bold text-[10px] uppercase">Hủy</button>
                            </div>
                          </div>
                        ) : (
                          <button onClick={() => setReplyId(f.id)} className="w-full bg-blue-600 text-white py-3 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-xl shadow-blue-100">Trả lời ngay</button>
                        )
                      )}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </main>
        </div>
      );
    };

    const ChatAssistant = () => {
      const [open, setOpen] = useState(false); const [input, setInput] = useState(''); const [loading, setLoading] = useState(false);
      const [msgs, setMsgs] = useState([{r:'ai', t:'Xin chào, tôi là trợ lý ảo BV Ninh Thuận. Bạn cần tôi giúp gì về quy trình góp ý không?'}]);
      const handleSend = async () => {
        if(!input.trim() || loading) return; const t = input; setInput(''); setMsgs(p => [...p, {r:'u', t}]); setLoading(true);
        try {
          const ai = new GoogleGenAI({apiKey: window.process?.env?.API_KEY || ''});
          const res = await ai.models.generateContent({model:'gemini-2.5-flash-lite-latest', contents: t, config:{systemInstruction: 'Bạn là trợ lý ảo tại BV Ninh Thuận, hãy hỗ trợ bệnh nhân gửi phản ánh lịch sự.'}});
          setMsgs(p => [...p, {r:'ai', t: res.text}]);
        } catch { setMsgs(p => [...p, {r:'ai', t: 'Hệ thống AI đang bận, vui lòng thử lại sau!'}]); } finally { setLoading(false); }
      };
      return (
        <div className="fixed bottom-6 right-6 z-50">
          {open ? (
            <div className="bg-white w-80 h-[450px] rounded-[2rem] shadow-2xl flex flex-col overflow-hidden border animate-in slide-in-from-bottom-5">
              <div className="bg-blue-600 p-4 text-white flex justify-between items-center"><span className="text-xs font-bold uppercase tracking-widest">Trợ lý ảo</span><button onClick={() => setOpen(false)}><i className="fas fa-times"></i></button></div>
              <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50">
                {msgs.map((m,i)=>(<div key={i} className={`flex ${m.r==='u'?'justify-end':'justify-start'}`}><div className={`max-w-[80%] p-3 rounded-2xl text-[11px] font-medium shadow-sm ${m.r==='u'?'bg-blue-600 text-white':'bg-white text-slate-800'}`}>{m.t}</div></div>))}
                {loading && <div className="text-[9px] text-slate-300 font-bold uppercase animate-pulse">Đang nạp...</div>}
              </div>
              <div className="p-3 border-t bg-white flex"><input className="flex-1 outline-none text-[11px] font-medium px-2" placeholder="Hỏi gì đó..." value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSend()} /><button onClick={handleSend} className="text-blue-600"><i className="fas fa-paper-plane"></i></button></div>
            </div>
          ) : (
            <button onClick={() => setOpen(true)} className="bg-blue-600 w-14 h-14 rounded-full text-white shadow-2xl flex items-center justify-center hover:scale-110 active:scale-90 transition-all"><i className="fas fa-robot text-xl"></i></button>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
