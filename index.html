
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Góp ý & Phản ánh - BVĐK Ninh Thuận</title>
  
  <!-- CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    #root { min-height: 100vh; }
    .loading-screen { 
      position: fixed; inset: 0; background: #ffffff; 
      display: flex; flex-direction: column; align-items: center; justify-content: center; 
      z-index: 9999; transition: opacity 0.5s ease-out; 
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #2563eb;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .fade-in { animation: fadeIn 0.8s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "recharts": "https://esm.sh/recharts@^3.7.0"
  }
}
</script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div id="root"></div>

  <!-- Màn hình chờ chuyên nghiệp -->
  <div class="loading-screen" id="initial-loader">
    <div class="spinner"></div>
    <p class="mt-4 text-blue-900 font-bold text-xs uppercase tracking-widest animate-pulse">Đang nạp dữ liệu bệnh viện...</p>
  </div>

  <script type="text/babel" data-presets="react,typescript">
    import React, { useState, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';

    // --- CẤU HÌNH HẰNG SỐ ---
    const HOSPITAL_NAME = "Bệnh viện Đa khoa Tỉnh Ninh Thuận";
    const ADDRESS = "Số 20 Nguyễn Văn Cừ, Phường Văn Hải, TP. Phan Rang - Tháp Chàm";
    const HOTLINE = "0259.3822.660";

    // --- COMPONENT TRANG CHỦ ---
    const App = () => {
      const [activeTab, setActiveTab] = useState('home');
      const [isLoaded, setIsLoaded] = useState(false);

      useEffect(() => {
        // Tắt màn hình chờ sau khi React sẵn sàng
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 500);
        }
        setIsLoaded(true);
      }, []);

      return (
        <div className={`min-h-screen flex flex-col bg-slate-50 ${isLoaded ? 'fade-in' : ''}`}>
          {/* Header */}
          <header className="bg-white border-b h-20 flex items-center shadow-sm sticky top-0 z-50">
            <div className="container mx-auto px-4 flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <div className="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg shadow-blue-100">
                  <i className="fas fa-hospital-alt text-xl"></i>
                </div>
                <div>
                  <h1 className="text-lg font-black text-blue-900 uppercase leading-none tracking-tighter">{HOSPITAL_NAME}</h1>
                  <p className="text-[10px] font-bold text-blue-500 uppercase tracking-widest mt-1">Hệ thống phản ánh trực tuyến</p>
                </div>
              </div>
              <div className="hidden md:block">
                <span className="text-xs font-bold text-gray-400 uppercase tracking-widest">Hotline: {HOTLINE}</span>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-grow container mx-auto px-4 py-12 max-w-4xl">
            <div className="text-center mb-12 space-y-4">
              <h2 className="text-4xl font-black text-slate-800 uppercase tracking-tight">Xin chào, chúng tôi luôn lắng nghe bạn</h2>
              <p className="text-gray-500 max-w-2xl mx-auto leading-relaxed italic">Mọi ý kiến đóng góp của quý bệnh nhân là động lực để Bệnh viện Đa khoa Ninh Thuận không ngừng hoàn thiện chất lượng phục vụ.</p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
              {/* Nút Gửi Phản Ánh */}
              <div className="bg-white p-10 rounded-[2.5rem] shadow-xl shadow-slate-200/50 border border-white hover:shadow-2xl hover:-translate-y-2 transition-all group cursor-pointer">
                <div className="w-20 h-20 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center mb-6 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                  <i className="fas fa-pen-nib text-3xl"></i>
                </div>
                <h3 className="text-2xl font-black text-slate-800 mb-3">Gửi Ý Kiến Phản Ánh</h3>
                <p className="text-gray-400 text-sm leading-relaxed mb-6">Gửi góp ý về thái độ phục vụ, cơ sở vật chất hoặc quy trình khám chữa bệnh.</p>
                <button className="w-full py-4 bg-blue-600 text-white rounded-2xl font-black uppercase tracking-widest text-sm shadow-lg shadow-blue-100 active:scale-95 transition-all">
                  Bắt đầu gửi ý kiến
                </button>
              </div>

              {/* Nút Tra Cứu */}
              <div className="bg-white p-10 rounded-[2.5rem] shadow-xl shadow-slate-200/50 border border-white hover:shadow-2xl hover:-translate-y-2 transition-all group cursor-pointer">
                <div className="w-20 h-20 bg-green-50 text-green-600 rounded-3xl flex items-center justify-center mb-6 group-hover:bg-green-600 group-hover:text-white transition-colors">
                  <i className="fas fa-search-location text-3xl"></i>
                </div>
                <h3 className="text-2xl font-black text-slate-800 mb-3">Tra Cứu Kết Quả</h3>
                <p className="text-gray-400 text-sm leading-relaxed mb-6">Theo dõi tiến độ xử lý và xem phản hồi chính thức từ Ban Giám đốc bệnh viện.</p>
                <button className="w-full py-4 bg-slate-800 text-white rounded-2xl font-black uppercase tracking-widest text-sm shadow-lg shadow-slate-100 active:scale-95 transition-all">
                  Tra cứu ngay
                </button>
              </div>
            </div>

            {/* Thông tin hỗ trợ */}
            <div className="mt-16 bg-blue-900 rounded-[3rem] p-10 text-white flex flex-col md:flex-row items-center justify-between gap-8">
              <div className="text-center md:text-left">
                <h4 className="text-xl font-bold mb-2">Bạn cần hỗ trợ khẩn cấp?</h4>
                <p className="text-blue-200 text-sm">Vui lòng gọi ngay số điện thoại trực đường dây nóng để được hỗ trợ tức thì.</p>
              </div>
              <a href={`tel:${HOTLINE}`} className="bg-white text-blue-900 px-8 py-4 rounded-2xl font-black text-lg flex items-center space-x-3 hover:bg-blue-50 transition-colors">
                <i className="fas fa-phone-alt animate-bounce"></i>
                <span>{HOTLINE}</span>
              </a>
            </div>
          </main>

          {/* Footer */}
          <footer className="bg-white border-t border-gray-100 py-12">
            <div className="container mx-auto px-4 text-center">
              <p className="font-black text-slate-800 uppercase tracking-tighter mb-4">{HOSPITAL_NAME}</p>
              <div className="flex flex-col md:flex-row justify-center items-center space-y-3 md:space-y-0 md:space-x-8 text-xs font-bold text-gray-400 uppercase tracking-widest">
                <span className="flex items-center"><i className="fas fa-map-marker-alt mr-2 text-blue-500"></i> {ADDRESS}</span>
                <span className="flex items-center"><i className="fas fa-envelope mr-2 text-red-400"></i> bvdk@ninhthuan.gov.vn</span>
              </div>
              <div className="mt-8 pt-8 border-t border-gray-50 text-[10px] text-gray-300 font-medium">
                © 2024 Bản quyền thuộc về Bệnh viện Đa khoa Tỉnh Ninh Thuận
              </div>
            </div>
          </footer>
        </div>
      );
    };

    // Khởi tạo React
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
