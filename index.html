
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Góp ý & Phản ánh - BVĐK Ninh Thuận</title>
  
  <!-- CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    #root { min-height: 100vh; }
    .loading-screen { 
      position: fixed; 
      inset: 0; 
      background: #f8fafc; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center; 
      z-index: 9999; 
      transition: opacity 0.5s ease-out; 
    }
  </style>

  <!-- Polyfill cho process.env -->
  <script>
    window.process = { env: { API_KEY: '' } };
  </script>

  <!-- Cấu hình thư viện từ CDN sạch hơn -->
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "recharts": "https://esm.sh/recharts@3.0.0-beta.10",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>

  <!-- Nạp Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div id="root"></div>

  <!-- Màn hình chờ -->
  <div class="loading-screen" id="initial-loader">
    <div class="flex flex-col items-center">
      <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-blue-900 font-bold uppercase text-xs tracking-widest">Đang khởi tạo hệ thống...</p>
    </div>
  </div>
  
  <!-- Script ẩn loader độc lập để tránh bị treo nếu React lỗi -->
  <script>
    window.addEventListener('load', function() {
      // Đợi thêm 2 giây để Babel biên dịch xong code
      setTimeout(function() {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 500);
        }
      }, 2500);
    });
  </script>

  <!-- Khởi chạy ứng dụng với cấu hình Babel đầy đủ cho TypeScript -->
  <script type="text/babel" data-presets="react,typescript" data-type="module">
    import "./index.tsx";
  </script>
</body>
</html>
